<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>BioImpact</title>
    <link rel='stylesheet' href='../../public/css/styles.css'>
    <script src="https://kit.fontawesome.com/adc9d4d85c.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="FilaDeItemsCentrados rectanguloHorizontal">

        <!-- Botón hamburguesa -->
        <button class="navbar-toggler hamburguesa d-md-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuMobile">
            <i class="fa-solid fa-seedling fa-2x" style="color: white;"></i>
        </button>

        <div class="container-logo">
           <a href="../views/index.html">
                <img class="logo" src="../../public/images/Logo.png" alt="Logo BioImpact">
            </a> 
        </div>

        <button
            class="d-md-none btn p-0 border-0 bg-transparent"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mobileSearch">
            <i class="fa-solid fa-magnifying-glass fa-2x" style="color: white;"></i>
        </button>
        
        <!-- Buscador mobile -->

        <div class="collapse d-md-none w-container" id="mobileSearch">
            <form class="p-2">
                <input
                    type="text"
                    class="form-control"
                    placeholder="Buscar proyectos...">
            </form>
        </div>

        <!-- Menú escritorio y tablet -->

        <nav class="flex-nav d-none d-md-flex">
        <form class="search-container">
            <input type="text" placeholder="Buscar proyectos..." class="search-input">
            <button type="submit" class="search-btn">Buscar</button>
        </form>

        <ul class="flex-ul">
            <li><a href="./ecoEscuelas.html" class="a-class">EcoEscuelas</a></li>
            <li><a href="./plantAr.html" class="a-class">PlantAr</a></li>
            <li><a href="./ceroResiduos.html" class="a-class">Cero Residuos</a></li>
            <li><a href="./guardianesDelAgua.html" class="a-class">Guardianes Del Agua</a></li>
        </ul>
    </nav>

    <div class="header-buttons d-none d-md-flex">
        <a href="./donaciones.html" class="donation-button">Doná Ahora</a>
        <a href="./login.html">
            <i class="fa-solid fa-user fa-xl login"></i>
        </a>
    </div>

        <!-- Menú celular -->
        <div class="collapse mobile-menu d-md-none" id="menuMobile">

            <ul class="flex-ul-mobile">
                <li><a href="./ecoEscuelas.html" class="a-class-index">EcoEscuelas</a></li>
                <li><a href="./plantAr.html" class="a-class-index">PlantAr</a></li>
                <li><a href="./ceroResiduos.html" class="a-class-index">Cero Residuos</a></li>
                <li><a href="./guardianesDelAgua.html" class="a-class-index">Guardianes Del Agua</a></li>
            </ul>

            <div class="mobile-buttons">
                <a href="./donaciones.html" class="donation-button">Doná Ahora</a>

                <a href="./login.html">
                    <i class="fa-solid fa-user fa-xl login"></i>
                </a>
            </div>

        </div>
        

    </header>
    <main class="contenedor-section">
        <form autocomplete="on" class="form" >
            <h1 class="h1-forms">Login</h1>
            <label for="usuario">Nombre de usuario</label>
            <input type="text" id="usuario" name="user"  >
            <label for="contraseña" class="formItems">Contraseña</label>
            <input type="password" id="contraseña" name="password">
            <input type="submit" value="Iniciar sesion" class="cajaSuave transicionOscuraDeColorTerciario">
        </form>
    </main>
    <footer class="rectanguloHorizontal FilaDeItemsCentrados">
       
       <p><i> todos los derechos de autor de la
        pagina esta todos reservados a BioImpact - 2018 </i> </p>
       <div class="box-grey a-class">
           <a href="./contacto.html" class="textoNormal transicionDeEscala contenidoBloque">Contactanos</a>
       </div>
       <div class="box-grey">
           <a href=""><i class="fa-brands fa-instagram fa-lg" ></i></a>
           <a href=""><i class="fa-brands fa-youtube fa-lg" ></i></a>
           <a href=""><i class="fa-brands fa-x-twitter fa-lg" ></i></a>
           <a href=""><i class="fa-brands fa-facebook fa-lg" ></i></a>
       </div> 
    
        
      
    </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
